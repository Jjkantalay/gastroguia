services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gastroguia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastroguia}
      POSTGRES_DB: gastroguia
    # Порт открыт только на этом компьютере — для локальной разработки (npm run dev)
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gastroguia"]
      interval: 5s
      retries: 10

  # Разовый запуск: docker compose run --rm migrate
  migrate:
    build: { context: ., target: builder }
    command: sh -c "npm run db:migrate && npm run db:seed"
    environment:
      DATABASE_URL: postgres://gastroguia:${POSTGRES_PASSWORD:-gastroguia}@db:5432/gastroguia
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gastroguia:${POSTGRES_PASSWORD:-gastroguia}@db:5432/gastroguia
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
